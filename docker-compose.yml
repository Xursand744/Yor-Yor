services:
  postgres:
    image: postgres:16-alpine
    container_name: toy24-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toy24
    ports:
      - "5432:5432"
    volumes:
      - toy24_pgdata:/var/lib/postgresql/data

volumes:
  toy24_pgdata:
